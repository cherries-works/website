<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <style>
    .z1 { animation: zz 2.4s steps(1) infinite; }
    .z2 { animation: zz 2.4s steps(1) infinite; animation-delay: 0.8s; }
    .z3 { animation: zz 2.4s steps(1) infinite; animation-delay: 1.6s; }
    @keyframes zz {
      0%, 33%   { opacity: 1; }
      34%, 100% { opacity: 0; }
    }
  </style>

  <!-- zzz -->
  <g fill="#f7f0e6">
    <g class="z3">
      <rect x="12" y="0" width="2" height="1"/><rect x="13" y="1" width="1" height="1"/><rect x="12" y="2" width="2" height="1"/>
    </g>
    <g class="z2">
      <rect x="9" y="1" width="2" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="9" y="3" width="2" height="1"/>
    </g>
    <g class="z1">
      <rect x="11" y="4" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/>
    </g>
  </g>

  <!-- curled body -->
  <rect x="5" y="7" width="6" height="1" fill="#d1502e"/>
  <rect x="4" y="8" width="8" height="1" fill="#d1502e"/>
  <rect x="3" y="9" width="10" height="1" fill="#d1502e"/>
  <rect x="3" y="10" width="10" height="1" fill="#d1502e"/>
  <rect x="3" y="11" width="10" height="2" fill="#d1502e"/>
  <rect x="4" y="13" width="8" height="1" fill="#d1502e"/>
  <!-- belly -->
  <rect x="5" y="11" width="6" height="1" fill="#f2d9b8"/>
  <rect x="6" y="12" width="4" height="1" fill="#f2d9b8"/>
  <!-- head resting on body -->
  <rect x="2" y="9" width="5" height="3" fill="#d1502e"/>
  <rect x="2" y="7" width="1" height="2" fill="#d1502e"/>
  <rect x="6" y="7" width="1" height="2" fill="#d1502e"/>
  <rect x="2" y="7" width="1" height="1" fill="#14100e"/>
  <rect x="6" y="7" width="1" height="1" fill="#14100e"/>
  <rect x="1" y="11" width="2" height="1" fill="#f7f0e6"/>
  <!-- closed eye -->
  <rect x="3" y="10" width="2" height="1" fill="#14100e"/>
  <!-- tail tip by the nose -->
  <rect x="0" y="12" width="2" height="1" fill="#f7f0e6"/>
</svg>