<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 32 26" width="640" height="520" shape-rendering="crispEdges">
  <style>
    .f { opacity: 0; animation: cycle 1.2s steps(1) infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: 0.15s; }
    .f3 { animation-delay: 0.3s; }
    .f4 { animation-delay: 0.45s; }
    .f5 { animation-delay: 0.6s; }
    .f6 { animation-delay: 0.75s; }
    .f7 { animation-delay: 0.9s; }
    .f8 { animation-delay: 1.05s; }
    @keyframes cycle {
      0%, 12.5% { opacity: 1; }
      12.51%, 100% { opacity: 0; }
    }
  </style>

  <!-- palette: red #d1502e, dark-red #8f2f1c, cream #f2d9b8,
       white #f7f0e6, black #14100e, nose #2b1a12 -->

  <!-- ===== FRAME 1: idle ===== -->
  <g class="f f1">
    <rect x="12" y="14" width="12" height="1" fill="#14100e" opacity="0.35"/>
    <g>
      <rect x="10" y="3" width="1" height="2" fill="#d1502e"/><rect x="10" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="3" width="1" height="2" fill="#d1502e"/><rect x="14" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="5" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="6" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="7" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="6" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="8" width="8" height="4" fill="#d1502e"/>
      <rect x="14" y="10" width="6" height="2" fill="#f2d9b8"/>
      <rect x="21" y="7" width="3" height="3" fill="#d1502e"/><rect x="24" y="6" width="2" height="2" fill="#f7f0e6"/>
      <rect x="15" y="12" width="1" height="2" fill="#8f2f1c"/>
      <rect x="19" y="12" width="1" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 2: crouch (anticipation) ===== -->
  <g class="f f2">
    <rect x="12" y="14" width="12" height="1" fill="#14100e" opacity="0.4"/>
    <g transform="translate(0,1)">
      <rect x="10" y="4" width="1" height="2" fill="#d1502e"/><rect x="10" y="4" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="4" width="1" height="2" fill="#d1502e"/><rect x="14" y="4" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="6" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="7" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="8" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="7" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="8" width="9" height="3" fill="#d1502e"/>
      <rect x="14" y="10" width="7" height="1" fill="#f2d9b8"/>
      <rect x="22" y="8" width="3" height="2" fill="#d1502e"/><rect x="25" y="9" width="2" height="1" fill="#f7f0e6"/>
      <rect x="15" y="11" width="2" height="2" fill="#8f2f1c"/>
      <rect x="19" y="11" width="2" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 3: launch ===== -->
  <g class="f f3">
    <rect x="12" y="14" width="12" height="1" fill="#14100e" opacity="0.3"/>
    <g transform="translate(0,-2)">
      <rect x="10" y="3" width="1" height="2" fill="#d1502e"/><rect x="10" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="3" width="1" height="2" fill="#d1502e"/><rect x="14" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="5" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="6" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="7" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="6" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="6" width="9" height="4" fill="#d1502e"/>
      <rect x="14" y="9" width="6" height="1" fill="#f2d9b8"/>
      <rect x="22" y="7" width="3" height="2" fill="#d1502e"/><rect x="25" y="8" width="2" height="1" fill="#f7f0e6"/>
      <rect x="14" y="10" width="2" height="2" fill="#8f2f1c"/>
      <rect x="20" y="10" width="2" height="3" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 4: rising ===== -->
  <g class="f f4">
    <rect x="13" y="14" width="10" height="1" fill="#14100e" opacity="0.18"/>
    <g transform="translate(0,-6)">
      <rect x="10" y="2" width="1" height="2" fill="#d1502e"/><rect x="10" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="2" width="1" height="2" fill="#d1502e"/><rect x="14" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="4" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="5" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="6" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="5" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="6" width="8" height="3" fill="#d1502e"/>
      <rect x="14" y="8" width="6" height="1" fill="#f2d9b8"/>
      <rect x="21" y="6" width="3" height="2" fill="#d1502e"/><rect x="24" y="5" width="2" height="2" fill="#f7f0e6"/>
      <rect x="14" y="9" width="1" height="2" fill="#8f2f1c"/>
      <rect x="20" y="9" width="1" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 5: apex ===== -->
  <g class="f f5">
    <rect x="14" y="14" width="8" height="1" fill="#14100e" opacity="0.12"/>
    <g transform="translate(0,-9)">
      <rect x="10" y="2" width="1" height="2" fill="#d1502e"/><rect x="10" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="2" width="1" height="2" fill="#d1502e"/><rect x="14" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="4" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="5" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="6" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="5" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="5" width="9" height="3" fill="#d1502e"/>
      <rect x="14" y="7" width="7" height="1" fill="#f2d9b8"/>
      <rect x="21" y="4" width="3" height="2" fill="#d1502e"/><rect x="24" y="3" width="2" height="2" fill="#f7f0e6"/>
      <rect x="13" y="8" width="1" height="2" fill="#8f2f1c"/>
      <rect x="20" y="8" width="1" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 6: falling ===== -->
  <g class="f f6">
    <rect x="13" y="14" width="10" height="1" fill="#14100e" opacity="0.18"/>
    <g transform="translate(0,-5)">
      <rect x="10" y="2" width="1" height="2" fill="#d1502e"/><rect x="10" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="2" width="1" height="2" fill="#d1502e"/><rect x="14" y="2" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="4" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="5" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="6" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="5" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="7" width="8" height="3" fill="#d1502e"/>
      <rect x="14" y="9" width="6" height="1" fill="#f2d9b8"/>
      <rect x="21" y="7" width="3" height="2" fill="#d1502e"/><rect x="24" y="8" width="2" height="1" fill="#f7f0e6"/>
      <rect x="14" y="10" width="1" height="3" fill="#8f2f1c"/>
      <rect x="20" y="10" width="1" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 7: landing squash ===== -->
  <g class="f f7">
    <rect x="12" y="14" width="12" height="1" fill="#14100e" opacity="0.4"/>
    <g transform="translate(0,1)">
      <rect x="10" y="4" width="1" height="2" fill="#d1502e"/><rect x="10" y="4" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="4" width="1" height="2" fill="#d1502e"/><rect x="14" y="4" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="6" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="7" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="8" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="7" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="8" width="9" height="3" fill="#d1502e"/>
      <rect x="14" y="10" width="7" height="1" fill="#f2d9b8"/>
      <rect x="22" y="8" width="3" height="2" fill="#d1502e"/><rect x="25" y="9" width="2" height="1" fill="#f7f0e6"/>
      <rect x="14" y="10" width="2" height="2" fill="#8f2f1c"/>
      <rect x="19" y="11" width="2" height="2" fill="#8f2f1c"/>
    </g>
  </g>

  <!-- ===== FRAME 8: recover ===== -->
  <g class="f f8">
    <rect x="12" y="14" width="12" height="1" fill="#14100e" opacity="0.35"/>
    <g>
      <rect x="10" y="3" width="1" height="2" fill="#d1502e"/><rect x="10" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="14" y="3" width="1" height="2" fill="#d1502e"/><rect x="14" y="3" width="1" height="1" fill="#14100e"/>
      <rect x="9" y="5" width="6" height="3" fill="#d1502e"/>
      <rect x="7" y="6" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="7" width="1" height="1" fill="#2b1a12"/>
      <rect x="11" y="6" width="1" height="1" fill="#14100e"/>
      <rect x="13" y="7" width="8" height="4" fill="#d1502e"/>
      <rect x="14" y="10" width="6" height="1" fill="#f2d9b8"/>
      <rect x="21" y="7" width="3" height="2" fill="#d1502e"/><rect x="24" y="6" width="2" height="2" fill="#f7f0e6"/>
      <rect x="15" y="11" width="1" height="3" fill="#8f2f1c"/>
      <rect x="19" y="11" width="1" height="3" fill="#8f2f1c"/>
    </g>
  </g>
</svg>