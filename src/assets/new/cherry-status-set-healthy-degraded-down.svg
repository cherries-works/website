<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 16" width="384" height="128" shape-rendering="crispEdges">
  <!-- ===== HEALTHY (x 0-15) ===== -->
  <g id="healthy">
    <rect x="7" y="2" width="1" height="3" fill="#7a4a2b"/>
    <rect x="8" y="1" width="1" height="2" fill="#7a4a2b"/>
    <rect x="9" y="1" width="4" height="2" fill="#3f9b42"/>
    <rect x="13" y="2" width="2" height="1" fill="#2c6e30"/>
    <rect x="10" y="1" width="1" height="1" fill="#66c46a"/>
    <rect x="5" y="4" width="6" height="1" fill="#d1332e"/>
    <rect x="4" y="5" width="8" height="1" fill="#d1332e"/>
    <rect x="3" y="6" width="10" height="1" fill="#d1332e"/>
    <rect x="3" y="7" width="10" height="2" fill="#d1332e"/>
    <rect x="3" y="9" width="10" height="2" fill="#d1332e"/>
    <rect x="4" y="11" width="8" height="2" fill="#d1332e"/>
    <rect x="5" y="13" width="6" height="1" fill="#d1332e"/>
    <rect x="10" y="8" width="2" height="3" fill="#8f1f22"/>
    <rect x="9" y="10" width="2" height="2" fill="#8f1f22"/>
    <rect x="5" y="5" width="1" height="1" fill="#f27a6a"/>
    <rect x="5" y="6" width="1" height="1" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ===== DEGRADED (x 16-31): drooping leaf, bruise ===== -->
  <g id="degraded" transform="translate(16,0)">
    <rect x="7" y="2" width="1" height="3" fill="#7a4a2b"/>
    <rect x="8" y="1" width="1" height="2" fill="#7a4a2b"/>
    <rect x="9" y="2" width="3" height="1" fill="#2c6e30"/>
    <rect x="11" y="3" width="3" height="1" fill="#2c6e30"/>
    <rect x="13" y="4" width="1" height="1" fill="#3f9b42"/>
    <rect x="5" y="4" width="6" height="1" fill="#d1332e"/>
    <rect x="4" y="5" width="8" height="1" fill="#d1332e"/>
    <rect x="3" y="6" width="10" height="1" fill="#d1332e"/>
    <rect x="3" y="7" width="10" height="2" fill="#d1332e"/>
    <rect x="3" y="9" width="10" height="2" fill="#d1332e"/>
    <rect x="4" y="11" width="8" height="2" fill="#d1332e"/>
    <rect x="5" y="13" width="6" height="1" fill="#d1332e"/>
    <rect x="10" y="8" width="2" height="3" fill="#8f1f22"/>
    <rect x="9" y="10" width="2" height="2" fill="#8f1f22"/>
    <!-- bruise -->
    <rect x="6" y="9" width="2" height="2" fill="#8f1f22"/>
    <rect x="5" y="6" width="1" height="1" fill="#f27a6a"/>
  </g>

  <!-- ===== DOWN (x 32-47): gray, snapped stem, falling leaf ===== -->
  <g id="down" transform="translate(32,0)">
    <rect x="7" y="3" width="1" height="2" fill="#7a4a2b"/>
    <!-- snapped stem stub -->
    <rect x="8" y="2" width="1" height="1" fill="#7a4a2b"/>
    <!-- detached leaf, falling -->
    <rect x="10" y="5" width="3" height="1" fill="#3f9b42"/>
    <rect x="11" y="6" width="1" height="1" fill="#2c6e30"/>
    <!-- desaturated body -->
    <rect x="5" y="4" width="6" height="1" fill="#9c5a5a"/>
    <rect x="4" y="5" width="8" height="1" fill="#9c5a5a"/>
    <rect x="3" y="6" width="10" height="1" fill="#9c5a5a"/>
    <rect x="3" y="7" width="10" height="2" fill="#9c5a5a"/>
    <rect x="3" y="9" width="10" height="2" fill="#9c5a5a"/>
    <rect x="4" y="11" width="8" height="2" fill="#9c5a5a"/>
    <rect x="5" y="13" width="6" height="1" fill="#9c5a5a"/>
    <rect x="10" y="8" width="2" height="3" fill="#6e3d3d"/>
    <rect x="9" y="10" width="2" height="2" fill="#6e3d3d"/>
    <!-- flat X eye-ish dead marks -->
    <rect x="6" y="6" width="2" height="1" fill="#6e3d3d"/>
  </g>
</svg>