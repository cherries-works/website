<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!-- ears -->
  <rect x="2" y="2" width="1" height="2" fill="#d1502e"/>
  <rect x="6" y="2" width="1" height="2" fill="#d1502e"/>
  <rect x="2" y="2" width="1" height="1" fill="#14100e"/>
  <rect x="6" y="2" width="1" height="1" fill="#14100e"/>
  <!-- head -->
  <rect x="1" y="4" width="6" height="3" fill="#d1502e"/>
  <rect x="0" y="5" width="2" height="2" fill="#f7f0e6"/>
  <rect x="0" y="5" width="1" height="1" fill="#2b1a12"/>
  <rect x="4" y="5" width="1" height="1" fill="#14100e"/>
  <!-- chest + body -->
  <rect x="2" y="7" width="2" height="5" fill="#f2d9b8"/>
  <rect x="3" y="7" width="6" height="5" fill="#d1502e"/>
  <!-- haunch -->
  <rect x="7" y="9" width="3" height="3" fill="#d1502e"/>
  <!-- front legs -->
  <rect x="3" y="12" width="1" height="3" fill="#8f2f1c"/>
  <rect x="5" y="12" width="1" height="3" fill="#8f2f1c"/>
  <!-- back paw -->
  <rect x="7" y="12" width="2" height="1" fill="#8f2f1c"/>
  <!-- tail curling around front -->
  <rect x="9" y="10" width="1" height="2" fill="#d1502e"/>
  <rect x="10" y="11" width="1" height="2" fill="#d1502e"/>
  <rect x="5" y="14" width="6" height="1" fill="#d1502e"/>
  <rect x="5" y="14" width="2" height="1" fill="#f7f0e6"/>
</svg>