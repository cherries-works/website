<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 16" width="560" height="320" shape-rendering="crispEdges">
  <style>
    .f { opacity: 0; animation: cycle 0.6s steps(1) infinite; }
    .f1 { animation-delay: 0s; }
    .f2 { animation-delay: 0.15s; }
    .f3 { animation-delay: 0.3s; }
    .f4 { animation-delay: 0.45s; }
    @keyframes cycle {
      0%, 25%   { opacity: 1; }
      25.01%, 100% { opacity: 0; }
    }
  </style>

  <!-- palette: red #d1502e, dark #8f2f1c, cream #f2d9b8,
       white #f7f0e6, black #14100e, nose #2b1a12 -->

  <!-- ===== FRAME 1: full stretch (gallop) ===== -->
  <g class="f f1">
    <rect x="9" y="1" width="1" height="2" fill="#d1502e"/><rect x="9" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="13" y="1" width="1" height="2" fill="#d1502e"/><rect x="13" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="8" y="3" width="6" height="3" fill="#d1502e"/>
    <rect x="6" y="4" width="2" height="2" fill="#f7f0e6"/><rect x="5" y="5" width="1" height="1" fill="#2b1a12"/>
    <rect x="11" y="4" width="1" height="1" fill="#14100e"/>
    <rect x="12" y="4" width="8" height="4" fill="#d1502e"/>
    <rect x="13" y="7" width="6" height="1" fill="#f2d9b8"/>
    <!-- tail streaming -->
    <rect x="20" y="4" width="5" height="2" fill="#d1502e"/>
    <rect x="25" y="4" width="2" height="1" fill="#f7f0e6"/>
    <!-- front legs reaching forward -->
    <rect x="11" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="10" y="9" width="1" height="1" fill="#8f2f1c"/>
    <rect x="9" y="10" width="1" height="1" fill="#8f2f1c"/>
    <rect x="13" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="12" y="9" width="1" height="1" fill="#8f2f1c"/>
    <!-- back legs extended back -->
    <rect x="17" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="18" y="9" width="1" height="1" fill="#8f2f1c"/>
    <rect x="19" y="10" width="1" height="1" fill="#8f2f1c"/>
    <rect x="19" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="20" y="9" width="1" height="1" fill="#8f2f1c"/>
    <!-- dust -->
    <rect x="7" y="12" width="1" height="1" fill="#f7f0e6" opacity="0.4"/>
  </g>

  <!-- ===== FRAME 2: passing pose (legs tucked, body up) ===== -->
  <g class="f f2" transform="translate(0,-1)">
    <rect x="9" y="1" width="1" height="2" fill="#d1502e"/><rect x="9" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="13" y="1" width="1" height="2" fill="#d1502e"/><rect x="13" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="8" y="3" width="6" height="3" fill="#d1502e"/>
    <rect x="6" y="4" width="2" height="2" fill="#f7f0e6"/><rect x="5" y="5" width="1" height="1" fill="#2b1a12"/>
    <rect x="11" y="4" width="1" height="1" fill="#14100e"/>
    <rect x="12" y="4" width="8" height="4" fill="#d1502e"/>
    <rect x="13" y="7" width="6" height="1" fill="#f2d9b8"/>
    <!-- tail up -->
    <rect x="20" y="2" width="4" height="2" fill="#d1502e"/>
    <rect x="24" y="1" width="2" height="2" fill="#f7f0e6"/>
    <!-- legs tucked under -->
    <rect x="12" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="14" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="17" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="19" y="8" width="1" height="3" fill="#8f2f1c"/>
  </g>

  <!-- ===== FRAME 3: stretch, other lead leg ===== -->
  <g class="f f3">
    <rect x="9" y="1" width="1" height="2" fill="#d1502e"/><rect x="9" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="13" y="1" width="1" height="2" fill="#d1502e"/><rect x="13" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="8" y="3" width="6" height="3" fill="#d1502e"/>
    <rect x="6" y="4" width="2" height="2" fill="#f7f0e6"/><rect x="5" y="5" width="1" height="1" fill="#2b1a12"/>
    <rect x="11" y="4" width="1" height="1" fill="#14100e"/>
    <rect x="12" y="4" width="8" height="4" fill="#d1502e"/>
    <rect x="13" y="7" width="6" height="1" fill="#f2d9b8"/>
    <!-- tail streaming -->
    <rect x="20" y="4" width="5" height="2" fill="#d1502e"/>
    <rect x="25" y="5" width="2" height="1" fill="#f7f0e6"/>
    <!-- front legs: one far forward, one under -->
    <rect x="10" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="9" y="9" width="1" height="2" fill="#8f2f1c"/>
    <rect x="13" y="8" width="1" height="3" fill="#8f2f1c"/>
    <!-- back legs: one back, one under -->
    <rect x="18" y="8" width="1" height="1" fill="#8f2f1c"/>
    <rect x="19" y="9" width="1" height="2" fill="#8f2f1c"/>
    <rect x="17" y="8" width="1" height="3" fill="#8f2f1c"/>
    <!-- dust -->
    <rect x="7" y="12" width="1" height="1" fill="#f7f0e6" opacity="0.4"/>
    <rect x="5" y="11" width="1" height="1" fill="#f7f0e6" opacity="0.3"/>
  </g>

  <!-- ===== FRAME 4: passing pose (tail down) ===== -->
  <g class="f f4" transform="translate(0,-1)">
    <rect x="9" y="1" width="1" height="2" fill="#d1502e"/><rect x="9" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="13" y="1" width="1" height="2" fill="#d1502e"/><rect x="13" y="1" width="1" height="1" fill="#14100e"/>
    <rect x="8" y="3" width="6" height="3" fill="#d1502e"/>
    <rect x="6" y="4" width="2" height="2" fill="#f7f0e6"/><rect x="5" y="5" width="1" height="1" fill="#2b1a12"/>
    <rect x="11" y="4" width="1" height="1" fill="#14100e"/>
    <rect x="12" y="4" width="8" height="4" fill="#d1502e"/>
    <rect x="13" y="7" width="6" height="1" fill="#f2d9b8"/>
    <!-- tail mid -->
    <rect x="20" y="3" width="4" height="2" fill="#d1502e"/>
    <rect x="24" y="3" width="2" height="1" fill="#f7f0e6"/>
    <!-- legs tucked -->
    <rect x="12" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="14" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="17" y="8" width="1" height="3" fill="#8f2f1c"/>
    <rect x="19" y="8" width="1" height="3" fill="#8f2f1c"/>
  </g>
</svg>