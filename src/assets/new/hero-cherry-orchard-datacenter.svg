  <rect x="30" y="7" width="2" height="1" fill="#141821"/><rect x="34" y="7" width="2" height="1" fill="#141821"/><rect x="38" y="7" width="2" height="1" fill="#4df08a"/><rect x="42" y="7" width="2" height="1" fill="#141821"/>
