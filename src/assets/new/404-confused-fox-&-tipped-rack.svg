<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 20" width="640" height="320" shape-rendering="crispEdges">
  <style>
    .led { animation: blink 0.6s steps(1) infinite; }
    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0.1; }
    }
    .q { animation: bob 1.2s steps(1) infinite; }
    @keyframes bob {
      0%, 49%  { transform: translateY(0); }
      50%, 100% { transform: translateY(-1px); }
    }
  </style>

  <!-- ground -->
  <rect x="0" y="18" width="40" height="2" fill="#221a30"/>

  <!-- tipped-over server rack (lying on its side) -->
  <rect x="2" y="12" width="14" height="6" fill="#3d4450"/>
  <rect x="3" y="13" width="12" height="4" fill="#1f242e"/>
  <rect x="4" y="13" width="10" height="1" fill="#2b3240"/>
  <rect x="4" y="15" width="10" height="1" fill="#2b3240"/>
  <!-- red LED blinking in distress -->
  <rect x="5" y="15" width="1" height="1" fill="#f05a4d" class="led"/>
  <!-- fallen server unit on the ground -->
  <rect x="17" y="16" width="4" height="2" fill="#2b3240"/>
  <rect x="18" y="16" width="1" height="1" fill="#4df08a"/>
  <!-- spilled cable -->
  <rect x="16" y="18" width="1" height="1" fill="#525b69"/>
  <rect x="15" y="17" width="1" height="1" fill="#525b69"/>

  <!-- confused fox -->
  <g transform="translate(11,4)">
    <rect x="10" y="3" width="1" height="2" fill="#d1502e"/><rect x="10" y="3" width="1" height="1" fill="#14100e"/>
    <rect x="14" y="3" width="1" height="2" fill="#d1502e"/><rect x="14" y="3" width="1" height="1" fill="#14100e"/>
    <rect x="9" y="5" width="6" height="3" fill="#d1502e"/>
    <rect x="7" y="6" width="2" height="2" fill="#f7f0e6"/><rect x="6" y="7" width="1" height="1" fill="#2b1a12"/>
    <rect x="11" y="6" width="1" height="1" fill="#14100e"/>
    <rect x="13" y="8" width="8" height="4" fill="#d1502e"/>
    <rect x="14" y="10" width="6" height="2" fill="#f2d9b8"/>
    <rect x="21" y="7" width="3" height="3" fill="#d1502e"/><rect x="24" y="6" width="2" height="2" fill="#f7f0e6"/>
    <rect x="15" y="12" width="1" height="2" fill="#8f2f1c"/>
    <rect x="19" y="12" width="1" height="2" fill="#8f2f1c"/>
  </g>

  <!-- question mark -->
  <g class="q" fill="#f7f0e6">
    <rect x="21" y="0" width="2" height="1"/>
    <rect x="23" y="1" width="1" height="1"/>
    <rect x="22" y="2" width="1" height="1"/>
    <rect x="22" y="4" width="1" height="1"/>
  </g>

  <!-- fox shadow -->
  <rect x="15" y="17" width="12" height="1" fill="#14100e" opacity="0.3"/>
</svg>