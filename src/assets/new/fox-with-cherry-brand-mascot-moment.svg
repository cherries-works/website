  <rect x="6" y="6" width="6" height="5" fill="#d1502e"/>
  <rect x="6" y="8" width="3" height="3" fill="#f2d9b8"/>
  <!-- legs -->
  <rect x="6" y="11" width="1" height="3" fill="#8f2f1c"/>
  <rect x="8" y="11" width="1" height="3" fill="#8f2f1c"/>
