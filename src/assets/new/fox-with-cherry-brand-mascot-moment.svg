<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!-- ears -->
  <rect x="5" y="1" width="1" height="2" fill="#d1502e"/>
  <rect x="9" y="1" width="1" height="2" fill="#d1502e"/>
  <rect x="5" y="1" width="1" height="1" fill="#14100e"/>
  <rect x="9" y="1" width="1" height="1" fill="#14100e"/>
  <!-- head -->
  <rect x="4" y="2" width="6" height="4" fill="#d1502e"/>
  <rect x="2" y="3" width="2" height="2" fill="#f7f0e6"/>
  <rect x="1" y="4" width="1" height="1" fill="#2b1a12"/>
  <rect x="7" y="3" width="1" height="1" fill="#14100e"/>
  <!-- cherry in front of the muzzle -->
  <rect x="1" y="6" width="3" height="3" fill="#d1332e"/>
  <rect x="2" y="8" width="2" height="1" fill="#8f1f22"/>
  <rect x="1" y="6" width="1" height="1" fill="#f27a6a"/>
  <rect x="1" y="5" width="1" height="1" fill="#7a4a2b"/>
  <rect x="2" y="4" width="1" height="1" fill="#7a4a2b"/>
  <rect x="0" y="3" width="1" height="1" fill="#3f9b42"/>
