  <!-- bushy tail -->
  <rect x="12" y="7" width="3" height="2" fill="#d1502e"/>
  <rect x="14" y="9" width="1" height="1" fill="#d1502e"/>
  <rect x="15" y="7" width="1" height="2" fill="#f7f0e6"/>
